name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check android/app/src/main/assets/auth.js
          node --check android/app/src/main/assets/ui.js
          node --check android/app/src/main/assets/profile.js
          node --check android/app/src/main/assets/device-profile.js
          node --check android/app/src/main/assets/finance-enhancements.js
          node --check android/app/src/main/assets/finance-enhancements-core.js
          node --check android/app/src/main/assets/currency-fix.js
          node --check android/app/src/main/assets/installment-progress.js
          node --check android/app/src/main/assets/installment-amounts.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build both installable APKs
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: do-seu-jeito-duplo-apks
          path: android/app/build/outputs/apk/*/debug/*.apk
