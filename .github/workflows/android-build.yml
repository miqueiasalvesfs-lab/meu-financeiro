name: Build Meu Lembrete APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK in build branch
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Meu-Lembrete-Android.apk
          printf 'SUCCESS\n' > dist/build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Meu-Lembrete-Android.apk dist/build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Build: APK instalável do Meu Lembrete [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Meu-Lembrete-Android
          path: dist/Meu-Lembrete-Android.apk
