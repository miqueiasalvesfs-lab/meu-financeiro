name: Build Meu Lembrete APK

on:
  push:
    branches:
      - build/meu-lembrete-apk
    paths:
      - 'meu-lembrete-android/**'
      - '.github/workflows/build-meu-lembrete.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p meu-lembrete-android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp meu-lembrete-android/app/build/outputs/apk/debug/app-debug.apk Meu-Lembrete-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Lembrete-Android
          path: Meu-Lembrete-Android.apk
          if-no-files-found: error
          retention-days: 7
