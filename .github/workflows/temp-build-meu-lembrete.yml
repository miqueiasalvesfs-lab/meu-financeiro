name: Temp Build Meu Lembrete

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'BUILD_MEULEMBRETE_APK'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated reminder branch
        uses: actions/checkout@v4
        with:
          ref: build/meu-lembrete-apk-v3
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Save installable APK on isolated branch
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Meu-Lembrete-Android.apk
          printf 'SUCCESS\n' > dist/build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Meu-Lembrete-Android.apk dist/build-status.txt
          git commit -m 'Build: APK instalável do Meu Lembrete' || true
          git push origin HEAD:build/meu-lembrete-apk-v3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Lembrete-Android
          path: dist/Meu-Lembrete-Android.apk
