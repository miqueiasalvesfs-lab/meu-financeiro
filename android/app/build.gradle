plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ganhosegastos.app'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName '1.6.0'
    }

    flavorDimensions += 'control'
    productFlavors {
        principal {
            dimension 'control'
            applicationId 'com.ganhosegastos.app'
            buildConfigField 'int', 'APP_SLOT', '1'
            resValue 'string', 'app_name', 'Do Seu Jeito'
        }
        segundo {
            dimension 'control'
            applicationId 'com.ganhosegastos.app2'
            buildConfigField 'int', 'APP_SLOT', '2'
            resValue 'string', 'app_name', 'Do Seu Jeito 2'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
