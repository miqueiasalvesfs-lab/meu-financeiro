import java.util.Base64

plugins {
    id 'com.android.application'
}

def payloadDir = file("$projectDir/.generated")
def payloadZip = file("$projectDir/.zap-source.zip")
payloadDir.deleteDir()
payloadDir.mkdirs()
def parts = fileTree("$projectDir/payload").matching { include 'part_*.b64' }.files.sort { a, b -> a.name <=> b.name }
def encoded = parts.collect { it.text }.join('').replaceAll('\\s', '')
payloadZip.bytes = Base64.getDecoder().decode(encoded)
copy {
    from zipTree(payloadZip)
    into payloadDir
}

buildDir = file('../app/build')

android {
    namespace 'com.zaplembrete.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zaplembrete.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$payloadDir/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$payloadDir/src/main/java")]
            res.srcDirs = [file("$payloadDir/src/main/res")]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
